            METHOD: POST
            PARSE_HJSON: "true"
            REQUIRED_VARIABLES: '["TOKEN","OWNER_NAME","REPOSITORY_NAME","BRANCH_NAME","BRANCH_SHA1"]'
            TIMEOUT: "30"
