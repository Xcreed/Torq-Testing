!!ExportedWorkflow
apiVersion: torq.io/v2alpha
kind: Workflow
id: 109c6899-28fb-4f61-9cd1-db8418e5abe4
name: VirusTotal URL Enrichment with Cache
trigger:
  onDemandTrigger:
    parameterList:
      parameters:
        - name: url
          description: The URL to analyze with VirusTotal
          required: true
          prettyName: URL
          shortText:
            defaultValue: ""
        - name: virustotal_integration
          description: The VirusTotal integration to use.
          required: true
          prettyName: virustotal_integration
          integration:
            defaultValue: ""
            vendor: virustotal_token
        - name: torq_integration
          description: The integration with Torq to use for the observable cache.
          required: true
          prettyName: Torq Integration
          integration:
            defaultValue: ""
            vendor: torq_token
        - name: virustotal_malicious_min_score
          description: The minimum score to consider a file malicious
          required: true
          prettyName: virustotal_malicious_min_score
          shortText:
            defaultValue: ""
        - name: virustotal_suspicious_min_score
          description: The minimum score to consider a file suspicious
          required: true
          prettyName: virustotal_suspicious_min_score
          shortText:
            defaultValue: ""
        - name: provide_raw_analysis_data
          description: Provide the full AlienVault information that was retrieved.
          required: true
          prettyName: Provide RAW Analysis Data
          boolean:
            defaultValue: false
    nestedOnly: true
playbook:
  steps:
    - name: us-docker.pkg.dev/stackpulse/public/utils/parameters_utils/workflow_parameters:1.3.0
      id: workflow_parameters
      env:
        SCHEMA: |-
          {
              "cache_ttl": {
                  "type": 11,
                  "prettyName": "Cache TTL",
                  "description": "The cache TTL set in hours to cache IOCs",
                  "uiPlaceholder": "24"
              }
          }
        VALUES: |-
          {
            "cache_ttl": 24
          }
      uuid: f8732b8f-e987-4c60-9924-afa628f551c0
      pretty_name: Workflow Parameters
      options:
        executor:
          name: utils_workflow_parameters_v_1_3_0
          env: {}
          sync: true
          disable: false
      manifestId: 30ebccc8-0ce8-5f13-960d-bc03b0179f53
      isPrivate: false
      mock_output:
        enabled: false
      skip: false
    - name: us-docker.pkg.dev/stackpulse/public/utils/cryptographic_utils/calculate-sha1:2.0.0
      id: calculate_sha1_of_url_in_base64
      env:
        FILE: '{{ b64enc $.event.url }}'
      uuid: d7204ba6-f36a-4c83-8b62-d8f95b87818e
      pretty_name: Calculate SHA1 of URL in base64
      options:
        executor:
          name: utils_infrastructure_v_1_12_0
          env:
            COMMAND: calculate_sha1
          sync: true
          disable: false
      manifestId: 3984d107-81b0-5b62-9868-e850cfb2ae77
      isPrivate: false
      mock_output:
        enabled: false
      skip: false
    - name: us-docker.pkg.dev/stackpulse/public/torq/get-a-variable:8.1.0
      id: read_observable_cache
      env:
        KEY: virustotal_{{ $.calculate_sha1_of_url_in_base64.result }}
      envFrom:
        integrationRef: '{{ $.event.torq_integration }}'
      uuid: 0837bac4-d847-4c3c-b42c-6839047328d5
      pretty_name: Read Observable Cache
      options:
        executor:
          name: http_request_v_4_6_0
          env:
            AUTHORIZATION: Bearer
            HEADERS: '{}'
            METHOD: GET
            PARSE_HJSON: "true"
            REQUIRED_VARIABLES: '["ACCESS_TOKEN", "KEY"]'
            TIMEOUT: "30"
            TOKEN: '{{ .ACCESS_TOKEN }}'
            URL: https://api.{{ .TORQ_BASE_URL }}/public/v2alpha/variables/{{ .KEY }}
          sync: true
          disable: false
      manifestId: 113df204-5b8d-5be4-8f22-895f9e87a732
      isPrivate: false
      mock_output:
        enabled: false
      skip: false
    - if:
        conditions:
          or:
            - and:
                - lvalue: '{{ $.read_observable_cache.api_object }}'
