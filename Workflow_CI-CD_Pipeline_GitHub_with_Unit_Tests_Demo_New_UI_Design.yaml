            "torq_integration": "torq_albertoc_dev",
            "github_integration": "my_github_token",
            "github_org": "Citasanchez",
            "root_branch": "main",
            "github_repo": "WF-CI-CD-Pipeline-Demo",
            "branch_name": "{{ $.remove_spaces_from_wf_name.result }}_{{ $.unix_time.result }}",
            "file_path": "workflows/{{ $.remove_spaces_from_wf_name.result }}.yaml",
