            CONTENT_TYPE: application/json; charset=utf-8
            HEADERS: |-
              {
                "Accept": "application/vnd.github.v3+json",
                "Authorization": "token {{ .TOKEN | jsonEscape }}",
                "Content-Type": "application/json"
