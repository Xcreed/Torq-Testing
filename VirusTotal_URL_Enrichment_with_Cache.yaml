                            REQUIRED_VARIABLES: '["VT_API_KEY", "URL_ADDRESS"]'
                            TIMEOUT: "30"
                            URL: https://www.virustotal.com/api/v3/urls/{{ .URL_ADDRESS | b64enc | trimAll "=" }}
