      content: '{"type":"doc","content":[{"type":"heading","attrs":{"level":2},"content":[{"type":"text","text":"VirusTotal URL Enrichment with Cache"}]},{"type":"paragraph"},{"type":"paragraph","content":[{"type":"text","text":"This workflow is designed to be used as a nested workflow to gather information from VirusTotal on a URL.  The output of the workflow will be saved in a cache via a Torq global variable for the specified amount of time in the workflow parameter cache setting."}]},{"type":"paragraph","content":[{"type":"text","text":"Set the malicious or suspicious engine count to the desired level for the workflow to consider the URL malicious or suspicious.  The default is set to 5 engines."}]},{"type":"paragraph","content":[{"type":"text","text":"If the URL is not found in VirusTotal it is submitted for analysis."}]},{"type":"paragraph","content":[{"type":"text","text":"The workflow will parse the last analysis stats for the count of engines that define the URL as malicious or suspicious.  If any categories include "},{"type":"text","marks":[{"type":"code"}],"text":"phishing"},{"type":"text","text":" in their text the phishing output variable will be set to "},{"type":"text","marks":[{"type":"code"}],"text":"true"},{"type":"text","text":"."}]},{"type":"paragraph","content":[{"type":"text","text":"Set the workflow parameter "},{"type":"text","marks":[{"type":"code"}],"text":"Provide RAW Analysis Data"},{"type":"text","text":" to provide the raw output to receive the full VirusTotal analysis."}]},{"type":"paragraph","content":[{"type":"text","text":"                    "},{"type":"image","attrs":{"src":"https://storage.googleapis.com/stackpulse-public/vendors/virustotal.svg","alt":null,"title":null}}]}]}'
